<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Combinato-Lite</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Combinato-Lite</h1>
    <p id="info" class="muted">Loading…</p>
  </header>

  <main class="layout">
    <aside>
      <h2>Groups</h2>
      <div class="toolbar">
        <button id="btn-refresh" type="button">Refresh</button>
        <button id="btn-merge" type="button" disabled>Merge selected</button>
      </div>
      <div class="type-bar">
        <span>Set type:</span>
        <button data-type="2" type="button">SU</button>
        <button data-type="1" type="button">MU</button>
        <button data-type="0" type="button">None</button>
        <button data-type="-1" type="button">Art</button>
      </div>
      <ul id="group-list"></ul>
    </aside>

    <section class="plots">
      <div id="wave-plot"></div>
      <div id="xcorr-plot"></div>
      <div id="raster-plot"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
