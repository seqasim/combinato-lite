[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "combinato-lite"
version = "0.1.0"
description = "Lightweight, portable Combinato spike sorting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Combinato-Lite contributors"},
]
keywords = ["spike-sorting", "electrophysiology", "neuroscience"]
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "h5py>=3.8,<4",
    "PyWavelets>=1.4,<2",
    "matplotlib>=3.7,<4",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "plotly>=5.18,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1,<6",
    "httpx>=0.27,<1",
]

[project.scripts]
combinato = "combinato.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
combinato = [
    "cluster/spc_bin/*",
    "gui/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
